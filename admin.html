<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Leads Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF7F2; --panel:#fff; --ink:#2B2420; --soft:#6B6258; --rust:#8A3E28; --line:#E3D8C6; --cream:#FAF5EC;}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; font-size:15px;}
  header{background:var(--panel); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  header h1{font-family:'Fraunces',serif; font-size:20px; margin:0; font-weight:600;}
  header h1 span{color:var(--rust);}
  .who{font-size:13px; color:var(--soft); display:flex; align-items:center; gap:12px;}
  main{max-width:1100px; margin:0 auto; padding:24px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; text-align:center; max-width:460px; margin:60px auto;}
  .card h2{font-family:'Fraunces',serif; margin:0 0 8px;}
  .card p{color:var(--soft); margin:0 0 20px; line-height:1.5;}
  button,.btn{font:inherit; font-weight:600; cursor:pointer; border-radius:8px; padding:10px 18px; border:1px solid var(--rust); background:var(--rust); color:#fff;}
  button.outline{background:#fff; color:var(--rust);}
  button:disabled{opacity:.5; cursor:default;}
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .toolbar .left{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  input[type=search]{font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; min-width:240px; background:#fff;}
  .count{color:var(--soft); font-size:14px;}
  .tablewrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:auto;}
  table{width:100%; border-collapse:collapse; min-width:640px;}
  th,td{text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  th{background:var(--cream); font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--soft); position:sticky; top:0;}
  tr:last-child td{border-bottom:none;}
  td a{color:var(--rust);}
  .empty{padding:40px; text-align:center; color:var(--soft);}
  .err{color:#A32D2D; font-weight:600; margin-top:14px;}
  .hidden{display:none !important;}
  @media(max-width:640px){main{padding:14px;} input[type=search]{min-width:0; width:100%;}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <h1>The Courtyard <span>Leads</span></h1>
  <div class="who hidden" id="who"><span id="whoEmail"></span><button class="outline" id="signOutBtn">Sign out</button></div>
</header>

<main>
  <!-- Signed out -->
  <div class="card" id="signedOut">
    <h2>Admin sign-in</h2>
    <p>Sign in with the authorized Google account to view and download leads.</p>
    <button id="signInBtn">Sign in with Google</button>
    <div class="err hidden" id="signInErr"></div>
  </div>

  <!-- Signed in but not allowed -->
  <div class="card hidden" id="denied">
    <h2>No access</h2>
    <p>This account isn't authorized to view leads. Sign out and try the authorized account.</p>
    <button class="outline" id="deniedOut">Sign out</button>
  </div>

  <!-- Leads -->
  <div id="leadsView" class="hidden">
    <div class="toolbar">
      <div class="left">
        <input type="search" id="search" placeholder="Search name, phone or email" aria-label="Search leads">
        <span class="count" id="count"></span>
      </div>
      <div class="left">
        <button class="outline" id="refreshBtn">Refresh</button>
        <button id="csvBtn">Download CSV</button>
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Date (PT)</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hidden" id="empty">No leads yet.</div>
    </div>
  </div>
</main>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyDTXTvBZ7su55oiGhT8y2ee7LME6dBl3eU",
    authDomain: "courtyard-67bdf.firebaseapp.com",
    projectId: "courtyard-67bdf",
    storageBucket: "courtyard-67bdf.firebasestorage.app",
    messagingSenderId: "199164604921",
    appId: "1:199164604921:web:c9935192464c2b3de18d28"
  });
  const auth = firebase.auth();
  const db = firebase.firestore();
  const $ = id => document.getElementById(id);
  let leads = [];

  function show(view){
    ['signedOut','denied','leadsView'].forEach(v => $(v).classList.toggle('hidden', v !== view));
  }
  function fmt(d){
    return d ? d.toLocaleString('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function render(){
    const q = $('search').value.trim().toLowerCase();
    const list = leads.filter(l => !q || (l.name+' '+l.phone+' '+l.email).toLowerCase().includes(q));
    $('count').textContent = list.length + (list.length === leads.length ? '' : ' of ' + leads.length) + ' lead' + (leads.length===1?'':'s');
    $('rows').innerHTML = list.map(l =>
      '<tr><td>'+esc(fmt(l.date))+'</td><td>'+esc(l.name)+'</td><td><a href="tel:'+esc(l.phone)+'">'+esc(l.phone)+'</a></td><td><a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a></td></tr>'
    ).join('');
    $('empty').classList.toggle('hidden', list.length > 0);
    $('csvBtn').disabled = leads.length === 0;
  }

  function load(){
    $('refreshBtn').disabled = true;
    return db.collection('leads').orderBy('createdAt','desc').get().then(snap => {
      leads = snap.docs.map(d => {
        const x = d.data();
        return {name:x.name||'', phone:x.phone||'', email:x.email||'', project:x.project||'', date: x.createdAt && x.createdAt.toDate ? x.createdAt.toDate() : null};
      });
      show('leadsView'); render();
    }).catch(err => {
      console.error(err);
      if (err.code === 'permission-denied') show('denied');
      else { show('leadsView'); $('rows').innerHTML=''; $('empty').textContent='Could not load leads: '+err.message; $('empty').classList.remove('hidden'); }
    }).finally(() => { $('refreshBtn').disabled = false; });
  }

  function csvCell(v){
    let s = String(v==null?'':v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;      // block spreadsheet formula injection
    return '"' + s.replace(/"/g,'""') + '"';
  }
  function downloadCsv(){
    const rows = [['Date (PT)','Name','Phone','Email','Project']];
    leads.forEach(l => rows.push([fmt(l.date), l.name, l.phone, l.email, l.project]));
    const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download = 'courtyard-leads-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  $('signInBtn').onclick = () => {
    $('signInErr').classList.add('hidden');
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
      $('signInErr').textContent = err.message; $('signInErr').classList.remove('hidden');
    });
  };
  const out = () => auth.signOut();
  $('signOutBtn').onclick = out; $('deniedOut').onclick = out;
  $('refreshBtn').onclick = load; $('csvBtn').onclick = downloadCsv;
  $('search').addEventListener('input', render);

  auth.onAuthStateChanged(user => {
    if (!user) { leads = []; $('who').classList.add('hidden'); show('signedOut'); return; }
    $('whoEmail').textContent = user.email; $('who').classList.remove('hidden');
    load();
  });
</script>
</body>
</html>
